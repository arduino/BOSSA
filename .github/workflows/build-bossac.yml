name: Build bossac

on:
  push:
    branches: [nrf]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CROSSBUILD_IMAGE: ghcr.io/arduino/crossbuild:0.2.2

jobs:
  crossbuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        run: echo "VERSION=$(git describe --tags --dirty --always)" >> "$GITHUB_ENV"

      - name: Build
        run: |
          docker run --rm \
            -v "$PWD":/workdir -w /workdir \
            -e VERSION \
            --entrypoint /bin/bash \
            "$CROSSBUILD_IMAGE" .github/scripts/crossbuild-bossac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bossac-crossbuild
          path: dist/*

  # The crossbuild image's macOS SDK predates Apple Silicon, so build arm64 natively
  osxarm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        run: echo "VERSION=$(git describe --tags --dirty --always)" >> "$GITHUB_ENV"

      - name: Build
        run: |
          touch src/WordCopyArm.cpp
          make bossac Q= OS=Darwin MACOS_ARCH=arm64 CXX=clang++ CXXFLAGS=-Wno-error VERSION="$VERSION"
          strip bin/bossac

      - name: Package
        run: |
          mkdir -p dist stage/bin
          cp bin/bossac stage/bin/
          tar -czf dist/bossac-$VERSION-osxarm64.tar.gz -C stage bin

      - uses: actions/upload-artifact@v4
        with:
          name: bossac-osxarm64
          path: dist/*

  test:
    name: Test (${{ matrix.target }})
    needs: [crossbuild, osxarm64]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux64,      runner: ubuntu-24.04 }
          - { target: linuxaarch64, runner: ubuntu-24.04-arm }
          - { target: osx,          runner: macos-latest, rosetta: true }
          - { target: osxarm64,     runner: macos-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Install Rosetta
        if: matrix.rosetta
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Extract
        run: tar -xzf dist/bossac-*-${{ matrix.target }}.tar.gz

      - name: Run tests
        run: python3 -I tests/run.py --bossac bin/bossac

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [crossbuild, osxarm64, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
